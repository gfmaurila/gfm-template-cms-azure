# Template placeholder generated for GFM.Template.CMS.
# The project generator must expand this workflow according to prompts.md and environment rules.
name: docker
on:
  workflow_dispatch:
  push:
    branches: [develop]
    paths:
      - '**/Dockerfile'
      - '**/docker-compose*.yml'
jobs:
  template:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generator expands docker build for local/Docker Compose stack
        run: echo "docker compose build && docker compose config --quiet"
      - name: Generator expands image build and push to Azure Container Registry
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - run: echo "az acr build --registry $AZURE_CONTAINER_REGISTRY -r ."