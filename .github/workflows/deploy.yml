name: Deploy by GitFlow Environment
on:
  push:
    branches: [hml, main]
    tags: ['v*.*.*.*']
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
env:
  AZURE_CONTAINER_REGISTRY: ${{ vars.AZURE_CONTAINER_REGISTRY }}
jobs:
  hml:
    if: github.ref == 'refs/heads/hml'
    runs-on: ubuntu-latest
    environment: hml
    steps:
      - uses: actions/checkout@v4
      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Generator expands homologation deployment to Azure Container Apps
        run: echo "az containerapp update / az containerapp revision set-active using GitHub Environment secrets/OIDC"

  production:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Generator expands deployment of approved vX.Y.Z.B release to production
        run: echo "az containerapp update / AKS rollout using GitHub Environment secrets/OIDC"